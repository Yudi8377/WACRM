name: wacrm

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/yudi8377/wacrm:main
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the least-privilege wacrm_runtime Neon URL}
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS origin}
      AUTH_URL: ${AUTH_URL:?Set AUTH_URL to the public HTTPS origin}
      AUTH_SECRET: ${AUTH_SECRET:?Set a strong AUTH_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY to a 32-byte base64 key}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v26.0}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app

  webhook-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/yudi8377/wacrm:main
    command: ["node", "scripts/webhook-worker.mjs"]
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      WEBHOOK_WORKER_DATABASE_URL: ${WEBHOOK_WORKER_DATABASE_URL:?Set WEBHOOK_WORKER_DATABASE_URL to the least-privilege wacrm_worker Neon URL}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app
    # No published ports and no access to web/app secrets.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to the public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
