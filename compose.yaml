name: wacrm

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/yudi8377/wacrm:main
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS origin}
      AUTH_URL: ${AUTH_URL:?Set AUTH_URL to the public HTTPS origin}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app

  webhook-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/yudi8377/wacrm:main
    command: ["node", "scripts/webhook-worker.mjs"]
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app
    # No published ports: the worker only polls the private Neon database.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to the public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
