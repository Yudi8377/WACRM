name: Android APK Build

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "WACRM production HTTPS base URL"
        required: false
        default: "https://wacrm-seven-dusky.vercel.app"

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run Android Kotlin unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug & Release APKs
        env:
          WACRM_BASE_URL: ${{ inputs.base_url || vars.WACRM_BASE_URL || 'https://wacrm-seven-dusky.vercel.app' }}
        run: |
          gradle assembleDebug assembleRelease --no-daemon -PWACRM_BASE_URL="${WACRM_BASE_URL}"
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/

      - name: Upload WACRM Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wacrm-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload WACRM Release Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: wacrm-android-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
