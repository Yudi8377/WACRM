name: Android APK Build

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "WACRM production HTTPS base URL"
        required: false
        default: "https://wacrm-commercial.dwahyudi8377.workers.dev"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK and accept licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore persistent release signing keystore cache
        uses: actions/cache@v4
        with:
          path: ~/.wacrm-android-signing
          key: wacrm-android-release-keystore-v1

      - name: Prepare persistent Release Signing Keystore (v1+v2+v3)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.wacrm-android-signing
          KEYSTORE_FILE="$HOME/.wacrm-android-signing/wacrm-release.jks"
          KS_PASS="${ANDROID_KEYSTORE_PASSWORD:-WacrmRelease2026!}"
          KEY_ALIAS="${ANDROID_KEY_ALIAS:-wacrm-release}"
          KEY_PASS="${ANDROID_KEY_PASSWORD:-WacrmRelease2026!}"

          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Using repository secret ANDROID_KEYSTORE_BASE64"
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "$KEYSTORE_FILE"
          elif [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Generating persistent 2048-bit RSA release keystore for PT WACRM Digital Nusantara"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 9125 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=PT WACRM Digital Nusantara, OU=Mobile Engineering, O=WACRM, L=Jakarta, ST=DKI Jakarta, C=ID"
          else
            echo "Reusing cached persistent release keystore (consistent SHA-256 across upgrades)"
          fi

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Run Android Kotlin unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build, ZipAlign, Sign (v1+v2+v3) & Verify Production Release APK
        env:
          INPUT_BASE_URL: ${{ inputs.base_url }}
          VAR_BASE_URL: ${{ vars.WACRM_BASE_URL }}
        run: |
          # Guarantee production Android APK always loads the unified Cloudflare Workers UX/UI
          # (never stale legacy Vercel URL unless explicitly passed via workflow_dispatch input).
          WACRM_BASE_URL="${INPUT_BASE_URL:-${VAR_BASE_URL}}"
          if [ -z "${WACRM_BASE_URL}" ] || echo "${WACRM_BASE_URL}" | grep -qi "wacrm-seven-dusky.vercel.app"; then
            WACRM_BASE_URL="https://wacrm-commercial.dwahyudi8377.workers.dev"
          fi
          echo "=== COMPILING CLEAN UNSIGNED RELEASE APK FOR BASE URL: ${WACRM_BASE_URL} ==="
          gradle clean assembleRelease --no-daemon -PWACRM_BASE_URL="${WACRM_BASE_URL}" -PANDROID_MANUAL_SIGN=true
          mkdir -p dist

          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          RAW_APK=""
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          else
            RAW_APK="app/build/outputs/apk/release/app-release.apk"
          fi
          echo "Raw unsigned APK: $RAW_APK ($(stat -c%s "$RAW_APK") bytes)"

          # Clean single-pass 4-byte + page alignment BEFORE signing (strict Android 11-15 PackageManager rule)
          "${BUILD_TOOLS}/zipalign" -f -v -p 4 "$RAW_APK" dist/wacrm-aligned.apk >/dev/null

          # Single-pass release signing with APK Signature Scheme v1, v2, and v3
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "${ANDROID_KEYSTORE_PATH}" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out dist/wacrm-android.apk \
            dist/wacrm-aligned.apk

          cp dist/wacrm-android.apk dist/wacrm-android-v5.3.4-signed.apk
          rm -f dist/wacrm-aligned.apk

          echo "=== GATE 1: VERIFYING APK SIGNATURE (v1/v2/v3) ==="
          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs dist/wacrm-android.apk

          echo "=== GATE 2: VERIFYING 4-BYTE ZIPALIGN ON FINAL SIGNED APK ==="
          "${BUILD_TOOLS}/zipalign" -c -v 4 dist/wacrm-android.apk >/dev/null
          echo "zipalign -c -v 4 PASS!"

          echo "=== GATE 3: VERIFYING Android 11-15 resources.arsc UNCOMPRESSED & 4-BYTE ALIGNED ==="
          python3 - <<'PY'
          import struct, zipfile

          apk = "dist/wacrm-android.apk"
          with open(apk, "rb") as raw:
              data = raw.read()
          assert data[:4] == b"PK\x03\x04", "Invalid APK ZIP magic bytes"
          assert b"APK Sig Block 42" in data, "Missing APK Signature Scheme v2/v3 block"

          with zipfile.ZipFile(apk, "r") as zf:
              names = set(zf.namelist())
              assert "AndroidManifest.xml" in names, "Missing AndroidManifest.xml"
              assert "classes.dex" in names, "Missing classes.dex"
              assert "resources.arsc" in names, "Missing resources.arsc"
              assert "META-INF/MANIFEST.MF" in names, "Missing v1 META-INF/MANIFEST.MF"

              info = zf.getinfo("resources.arsc")
              assert info.compress_type == zipfile.ZIP_STORED, f"resources.arsc must be STORED (0), got {info.compress_type}"
              # Compute exact data offset from local file header (30 bytes + filename len + extra len)
              lh_offset = info.header_offset
              _, _, _, _, _, _, _, _, _, fname_len, extra_len = struct.unpack_from("<IHHHHHIIIHH", data, lh_offset)
              data_offset = lh_offset + 30 + fname_len + extra_len
              assert data_offset % 4 == 0, f"resources.arsc data_offset={data_offset} is NOT 4-byte aligned!"
              print(f"PASS: resources.arsc STORED, size={info.file_size}, data_offset={data_offset} (mod 4 == 0)")
              print(f"PASS: total entries={len(names)}, total APK bytes={len(data)}")
          PY

          echo "=== GATE 4: VERIFYING APK MANIFEST BADGING ==="
          BADGING=$("${BUILD_TOOLS}/aapt2" dump badging dist/wacrm-android.apk)
          echo "$BADGING" | head -n 25
          echo "$BADGING" | grep -q "package: name='com.wacrm.android'"
          echo "$BADGING" | grep -q "versionCode='12'"
          echo "$BADGING" | grep -q "versionName='5.3.4'"
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "::error::Release APK must NOT have application-debuggable set!"
            exit 1
          fi

          (cd dist && sha256sum wacrm-android.apk wacrm-android-v5.3.4-signed.apk > SHA256SUMS-android.txt)
          cat dist/SHA256SUMS-android.txt
          ls -lh dist/

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wacrm-android-v5.3.4-signed-apk
          path: |
            android/dist/wacrm-android.apk
            android/dist/wacrm-android-v5.3.4-signed.apk
            android/dist/SHA256SUMS-android.txt
          retention-days: 30

      - name: Publish Signed Production Release APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v5.3.4"
          TITLE="WACRM Android v5.3.4 — Fix Instalasi Android (Clean Single-Pass ZipAlign+Sign v1/v2/v3 + Cloudflare Edge CDN)"
          NOTES=$(cat <<'EOF'
          Aplikasi Android native Kotlin **WACRM v5.3.4** (Package ID resmi `com.wacrm.android`, `versionCode 12`, `minSdk 24 / Android 7.0+`, `targetSdk 34 / Android 14–15`) yang terhubung langsung ke **https://wacrm-commercial.dwahyudi8377.workers.dev/**.

          Perbaikan Kritis Instalasi v5.3.4:
          - **Clean Single-Pass Alignment & Signing:** APK dibangun unsigned, diselaraskan 4-byte (`zipalign -p 4` terverifikasi `zipalign -c -v 4` + `resources.arsc` STORED & 4-byte aligned untuk Android 11–15), lalu ditandatangani satu kali penuh dengan APK Signature Scheme v1 + v2 + v3.
          - **Bebas Korupsi Unduhan (0ms Cloudflare Edge Static CDN):** Berkas APK sekarang dikirim langsung melalui Cloudflare Edge Static Asset (`/downloads/WACRM-v5.3.4-Android.apk`) sehingga tidak lagi memicu HTTP 500 / pemotongan stream pada Workers Free Tier.
          - **Sinkronisasi Penuh UX/UI Commercial OS + Kebijakan Privasi (UU PDP No. 27/2022):** Langsung memuat tampilan korporat `https://wacrm-commercial.dwahyudi8377.workers.dev/` beserta akses resmi `https://wacrm-commercial.dwahyudi8377.workers.dev/privacy`.

          - **wacrm-android.apk**: APK Release Signed resmi siap instal langsung di HP Android.
          - **wacrm-android-v5.3.4-signed.apk**: Salinan berversi untuk arsip distribusi.
          - **SHA256SUMS-android.txt**: Checksum integritas resmi.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/wacrm-android.apk dist/wacrm-android-v5.3.4-signed.apk dist/SHA256SUMS-android.txt --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" dist/wacrm-android.apk dist/wacrm-android-v5.3.4-signed.apk dist/SHA256SUMS-android.txt \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --target "${{ github.sha }}"
          fi

          # Also refresh legacy tags so older bookmarks download the verified v5.3.4 APK
          for LEGACY_TAG in android-v5.3.3 android-v5.3.2 android-v4.0.0; do
            if gh release view "$LEGACY_TAG" >/dev/null 2>&1; then
              gh release upload "$LEGACY_TAG" dist/wacrm-android.apk --clobber || true
            fi
          done
