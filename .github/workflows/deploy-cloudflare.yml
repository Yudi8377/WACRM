name: Deploy to Cloudflare Workers (Rp 0 Commercial Tier)

on:
  workflow_dispatch:
    inputs:
      target_app:
        description: "Aplikasi yang akan di-deploy ke Cloudflare Workers"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - wacrm
          - wacrm-enterprise

jobs:
  deploy-wacrm:
    if: github.event.inputs.target_app == 'both' || github.event.inputs.target_app == 'wacrm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install OpenNext Cloudflare & Wrangler
        run: npm install --no-save @opennextjs/cloudflare wrangler
      - name: Build WACRM for Cloudflare Workers
        run: npx opennextjs-cloudflare build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
      - name: Deploy WACRM to Cloudflare Workers (Commercial Free Tier)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-wacrm-enterprise:
    if: github.event.inputs.target_app == 'both' || github.event.inputs.target_app == 'wacrm-enterprise'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/marketing-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Install OpenNext Cloudflare & Wrangler
        run: npm install --no-save @opennextjs/cloudflare wrangler
      - name: Build Enterprise Marketing Web for Cloudflare Workers
        run: npx opennextjs-cloudflare build
      - name: Deploy Enterprise Web to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
