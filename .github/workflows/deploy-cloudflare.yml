name: Deploy to Cloudflare Workers (Rp 0 Commercial Tier)

on:
  push:
    branches:
      - main
      - arena/ea0f83cd-wacrm
  workflow_dispatch:
    inputs:
      target_app:
        description: "Aplikasi yang akan di-deploy ke Cloudflare Workers"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - wacrm
          - wacrm-enterprise

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-wacrm:
    if: github.event_name == 'push' || github.event.inputs.target_app == 'both' || github.event.inputs.target_app == 'wacrm'
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets configured
        id: cf_check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Cloudflare deploy: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not configured."
          fi

      - uses: actions/checkout@v4
        if: steps.cf_check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.cf_check.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.cf_check.outputs.ready == 'true'
        run: npm ci

      - name: Bundle Verified Signed Android APK v5.3.4 into Cloudflare Edge Static Assets
        if: steps.cf_check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public/downloads
          APK_OUT="public/downloads/WACRM-v5.3.4-Android.apk"
          if ! gh release download android-v5.3.4 -p wacrm-android.apk -O "$APK_OUT" --clobber; then
            echo "Fallback: downloading latest release APK..."
            curl -fL "https://github.com/Yudi8377/WACRM/releases/latest/download/wacrm-android.apk" -o "$APK_OUT"
          fi
          APK_SIZE=$(stat -c%s "$APK_OUT")
          APK_MAGIC=$(head -c 4 "$APK_OUT" | xxd -p)
          echo "Bundled static Android APK: $APK_OUT (${APK_SIZE} bytes, magic=${APK_MAGIC})"
          test "$APK_MAGIC" = "504b0304"
          test "$APK_SIZE" -gt 2000000
          cp "$APK_OUT" public/downloads/wacrm-android.apk
          sha256sum "$APK_OUT" | awk '{print $1}' > /tmp/expected-apk.sha256

      - name: Build WACRM for Cloudflare Workers
        if: steps.cf_check.outputs.ready == 'true'
        run: npx opennextjs-cloudflare build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}

      - name: Deploy WACRM to Cloudflare Workers (Rp 0 Commercial Free Tier)
        if: steps.cf_check.outputs.ready == 'true'
        run: |
          npx wrangler deploy | tee /tmp/wrangler-wacrm.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/wrangler-wacrm.log | head -1 || true)
          if [ -n "$URL" ]; then
            echo "### WACRM Commercial OS Live on Cloudflare Workers (Rp 0 Commercial Tier)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Live URL: $URL" >> "$GITHUB_STEP_SUMMARY"
            echo "- Setup & Activation Console: $URL/setup" >> "$GITHUB_STEP_SUMMARY"
            echo "- Android APK v5.3.4 (0ms Edge Static Asset): $URL/downloads/WACRM-v5.3.4-Android.apk" >> "$GITHUB_STEP_SUMMARY"
            echo "- Android Installer Page: $URL/android" >> "$GITHUB_STEP_SUMMARY"
            echo "=== LIVE SMOKE VERIFICATION OF CLOUDFLARE APK DOWNLOAD ==="
            EXPECTED_SHA=$(cat /tmp/expected-apk.sha256)
            curl -fL -D /tmp/apk-static.headers "$URL/downloads/WACRM-v5.3.4-Android.apk" -o /tmp/live-static.apk
            grep -i "application/vnd.android.package-archive" /tmp/apk-static.headers
            ACTUAL_STATIC_SHA=$(sha256sum /tmp/live-static.apk | awk '{print $1}')
            echo "Static APK SHA-256: $ACTUAL_STATIC_SHA (expected: $EXPECTED_SHA)"
            test "$ACTUAL_STATIC_SHA" = "$EXPECTED_SHA"
            curl -fL "$URL/api/download/android-apk" -o /tmp/live-api.apk
            ACTUAL_API_SHA=$(sha256sum /tmp/live-api.apk | awk '{print $1}')
            echo "API Redirect APK SHA-256: $ACTUAL_API_SHA (expected: $EXPECTED_SHA)"
            test "$ACTUAL_API_SHA" = "$EXPECTED_SHA"
            rm -f /tmp/live-static.apk /tmp/live-api.apk /tmp/apk-static.headers /tmp/expected-apk.sha256
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Runtime Secrets to Cloudflare Worker (Encrypted)
        if: steps.cf_check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUBLISHER_SYNC_SECRET: ${{ secrets.PUBLISHER_SYNC_SECRET }}
          PUBLISHER_LICENSE_API_URL: ${{ secrets.PUBLISHER_LICENSE_API_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY }}
          XENDIT_WEBHOOK_TOKEN: ${{ secrets.XENDIT_WEBHOOK_TOKEN }}
          TRIPAY_API_KEY: ${{ secrets.TRIPAY_API_KEY }}
          TRIPAY_PRIVATE_KEY: ${{ secrets.TRIPAY_PRIVATE_KEY }}
          TRIPAY_MERCHANT_CODE: ${{ secrets.TRIPAY_MERCHANT_CODE }}
        run: |
          node -e '
            const keys = [
              "DATABASE_URL","DATABASE_URL_UNPOOLED","AUTH_SECRET","APP_ENCRYPTION_KEY",
              "CRON_SECRET","PUBLISHER_SYNC_SECRET","PUBLISHER_LICENSE_API_URL",
              "RESEND_API_KEY","BREVO_API_KEY","MIDTRANS_SERVER_KEY","XENDIT_SECRET_KEY",
              "XENDIT_WEBHOOK_TOKEN","TRIPAY_API_KEY","TRIPAY_PRIVATE_KEY","TRIPAY_MERCHANT_CODE"
            ];
            const out = {};
            for (const k of keys) {
              if (process.env[k] && process.env[k].trim()) out[k] = process.env[k].trim();
            }
            if (Object.keys(out).length > 0) {
              require("fs").writeFileSync("/tmp/cf-secrets.json", JSON.stringify(out));
              console.log("Prepared " + Object.keys(out).length + " Cloudflare Worker runtime secrets: " + Object.keys(out).join(", "));
            } else {
              console.log("No optional runtime secrets set in GitHub Secrets yet.");
            }
          '
          if [ -f /tmp/cf-secrets.json ]; then
            npx wrangler secret bulk /tmp/cf-secrets.json
            rm -f /tmp/cf-secrets.json
          fi

  deploy-wacrm-enterprise:
    if: github.event_name == 'push' || github.event.inputs.target_app == 'both' || github.event.inputs.target_app == 'wacrm-enterprise'
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets configured
        id: cf_check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Cloudflare deploy: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not configured."
          fi

      - uses: actions/checkout@v4
        if: steps.cf_check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.cf_check.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.cf_check.outputs.ready == 'true'
        working-directory: apps/marketing-web
        run: npm ci

      - name: Build Enterprise Marketing Web for Cloudflare Workers
        if: steps.cf_check.outputs.ready == 'true'
        working-directory: apps/marketing-web
        run: npx opennextjs-cloudflare build

      - name: Deploy Enterprise Web to Cloudflare Workers (Rp 0 Commercial Free Tier)
        if: steps.cf_check.outputs.ready == 'true'
        working-directory: apps/marketing-web
        run: |
          npx wrangler deploy | tee /tmp/wrangler-enterprise.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/wrangler-enterprise.log | head -1 || true)
          if [ -n "$URL" ]; then
            echo "### WACRM Enterprise Web Live on Cloudflare Workers (Rp 0 Commercial Tier)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Live URL: $URL" >> "$GITHUB_STEP_SUMMARY"
            echo "- Legal Pages: $URL/privacy · $URL/terms · $URL/refund" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
